<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tạo form và các điều khiển</title>
    </head>
    <body>
        <form method="post" id="myForm" name="myForm">
            <table align="center"
                style="background-color: rgb(245, 245, 178); border-collapse: collapse; color: rgb(61, 52, 224); font-weight: bold;"
                border="2px">
                <tr>
                    <td colspan="2"
                        style="color: rgb(61, 52, 224); background-color: white ; font-size: 30px;font-weight:bold;"
                        align="center">Đăng ký
                        du lịch</td>
                </tr>
                <tr>
                    <td><label for="name">Họ và tên</label></td>
                    <td><input type="text" id="name" required></td>
                </tr>

                <tr>
                    <td><label for="location">Địa chỉ</label></td>
                    <td><input type="text" id="location" required></td>
                </tr>

                <tr>
                    <td><label for="phone">Điện thoại</label></td>
                    <td><input type="text" id="phone" required></td>
                </tr>

                <tr>
                    <td><label for="VN-visitor">Khách Việt Nam</label></td>
                    <td><input type="checkbox" id="VN-visitor"></td>
                </tr>

                <tr>
                    <td><label for="tour">Chọn tour</label></td>
                    <td><select id="tour">
                            <optgroup label="Miền Bắc">
                                <option>Hà Nội - Hạ Long - Sapa</option>
                                <option>Hà Nội - Chùa Hương - Ninh Bình</option>
                                <option>Hà Nội - Cát Bà - Tuấn Châu</option>
                            </optgroup>
                            <optgroup label="Miền Trung">
                                <option>Huế - Bạch Mã - Đà Nẵng</option>
                                <option>Nha Trang - Đà Lạt</option>
                                <option>Buôn mê thuột - Gia Lai -
                                    Kontum</option>
                            </optgroup>
                            <optgroup label="Miền Nam">
                                <option>TP.HCM - Cần Thơ - Cà Mau</option>
                                <option>TP.HCM - Mỹ Tho</option>
                            </optgroup>
                        </select></td>
                </tr>

                <tr>
                    <td>Phương tiện</td>
                    <td>
                        <input type="radio" name="vehicle" id="plane" required>
                        <label for="plane">Máy bay</label>
                        <input type="radio" name="vehicle" id="car" required>
                        <label for="car">Xe ô tô</label>
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        <fieldset>
                            <legend
                                style="color: rgb(243, 45, 64); font-style: italic;">Số
                                lượng đoàn khách</legend>
                            <label for="adult">Người lớn</label>
                            <input type="number" id="adult" required>
                            <label for="children">Trẻ em</label>
                            <input type="number" id="children" required>
                        </fieldset>
                    </td>
                </tr>

                <tr>
                    <td><label for="note">Ghi chú thêm</label></td>
                    <td><textarea id="note"
                            style="width: 250px;"></textarea></td>
                </tr>

                <tr align="center">
                    <td colspan="2"><input type="button" value="Đồng ý"
                            onclick="xacNhanDangKy()"></td>
                </tr>
                <tr>
                    <td colspan="2" style="color:red; font-weight: bold;"
                        align="center"><span id="thong-bao"></span></td>
                </tr>
            </table>
        </form>
        <script>
            function xacNhanDangKy()
            {
                let form = document.getElementById("myForm");
                if(form.reportValidity()){
                    document.getElementById("thong-bao").innerText ="Bạn đã đăng ký thành công!!!";
                }
            }
        </script>
    </body>
</html>
