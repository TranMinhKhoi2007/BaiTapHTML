<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo form và các điều khiển trên form</title>
</head>
<body>
    <h2 style="color: brown; text-align: center;" >Đăng nhập</h2>
    <form method="post">
        <table border="2" style="background-color: rgb(154, 232, 232);" align="center">
            <tr>
                <td>
                    <label for="name">Mã người dùng:</label>
                </td>
                <td><input type="text" id="name"></td>
            </tr>
            <tr>
                <td>
                    <label for="pass">Mật khẩu:</label>
                </td>
                <td><input type="password" id="pass"></td>
            </tr>
            <tr align="center">
                <td colspan="2">
                    <button type="submit">Đồng ý</button>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
