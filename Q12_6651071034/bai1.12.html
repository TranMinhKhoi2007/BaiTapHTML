<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tạo form và các điều khiển</title>
    </head>
    <body>
        <form method="post">
            <table align="center"
                style="background-color: rgb(163, 232, 163);border-collapse: collapse; "
                border="2px solid">
                <tr style="background-color: white;">
                    <td colspan="2"
                        style="color: green; font-size: larger;"><b>Phiếu đăng
                            ký tham gia chương trình khuyến mãi</b></td>
                </tr>
                <tr>
                    <td><label for="username">Họ và tên</label></td>
                    <td><input type="text" id="username" required></td>
                </tr>
                <tr>
                    <td><label for="location">Địa chỉ</label></td>
                    <td><input type="text" id="location"></td>
                </tr>
                <tr>
                    <td><label for="phone">Điện thoại</label></td>
                    <td><input type="tel" id="phone"></td>
                </tr>
                <tr>
                    <td>Phái</td>
                    <td>
                        <input type="radio" name="sex" id="male">
                        <label for="male">Nam</label>
                        <input type="radio" name="sex" id="female"><label
                            for="female">Nữ</label>
                    </td>
                </tr>
                <tr>
                    <td><label for="job">Nghề nghiệp</label></td>
                    <td>
                        <select name="jobs" id="job">
                            <option value="Bác sĩ">Bác sĩ</option>
                            <option value="Kỹ sư">Kỹ sư</option>
                            <option value="Giáo viên">Giáo viên</option>
                            <option value="Khác">Khác</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label for="product">Chọn sản phẩm tham gia</label></td>
                    <td>
                        <select name="Product" id="product" multiple>
                            <option value="Kem đánh răng">Kem đánh răng</option>
                            <option value="Bột giặt">Bột giặt</option>
                            <option value="Dầu gội đầu">Dầu gội đầu
                            </option>
                            <option value="Sữa tắm">Sữa tắm</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label for="people">Số người dự đoán tham
                            gia</label></td>
                    <td><input type="number" id="people"></td>
                </tr>

                <tr align="center">
                    <td colspan="2"><input type="button" value="Đồng ý" onclick="xacNhanDangKy()"></td>
                </tr>
                <tr>
                    <td colspan="2" style="color:red; font-weight: bold;" align="center"><span id="thong-bao"></span></td>
                </tr>
            </table>
        </form>
        <script>
            function xacNhanDangKy()
            {
                document.getElementById("thong-bao").innerText ="Bạn đã đăng ký thành công!!!"
            }
        </script>
    </body>
</html>
